plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'com.shamil.kumyktranslator.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.shamil.kumyktranslator.app"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.2-native"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
