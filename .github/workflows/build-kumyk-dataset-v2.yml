name: Build Kumyk AI Dataset v2

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-kumyk-dataset-v2.yml"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 "huggingface_hub>=0.25" "datasets>=3.0" pandas pyarrow "gdown>=6.1.0"

      - name: Write v2 collector
        shell: bash
        run: |
          cat > collect_kumyk_dataset_v2.py <<'PY'

          from __future__ import annotations

          from pathlib import Path
          import bz2
          import collections
          import csv
          import gzip
          import hashlib
          import json
          import os
          import re
          import shutil
          import subprocess
          import tarfile
          import traceback
          import unicodedata
          import zipfile
          from typing import Iterable

          import requests

          ROOT = Path("kumyk_dataset_v2")
          RAW = ROOT / "raw"
          PROC = ROOT / "processed"
          FINAL = ROOT / "final"
          REPORTS = ROOT / "reports"
          for p in (RAW, PROC, FINAL, REPORTS):
              p.mkdir(parents=True, exist_ok=True)

          MANIFEST = []
          ERRORS = []

          BIBLE_GENERAL_CAP = 1500
          MONO_CHAR_CAP_PER_WEB_SOURCE = 20_000_000

          def log(*args):
              print(*args, flush=True)

          def add_manifest(source_id, kind, license_name, rows=None, note="", extra=None):
              rec = {
                  "source_id": source_id,
                  "kind": kind,
                  "license": license_name,
                  "rows": rows,
                  "note": note,
              }
              if extra:
                  rec.update(extra)
              MANIFEST.append(rec)

          def fail(source_id, exc):
              msg = f"{type(exc).__name__}: {exc}"
              ERRORS.append({"source_id": source_id, "error": msg})
              log("WARNING", source_id, msg)
              traceback.print_exc()

          def norm(s: str) -> str:
              s = unicodedata.normalize("NFC", s or "").replace("\u00a0", " ")
              s = re.sub(r"\s+", " ", s).strip()
              s = re.sub(r"\s+([,.;:!?])", r"\1", s)
              return s

          def cyr_ratio(s: str) -> float:
              letters = [c for c in s if c.isalpha()]
              if not letters:
                  return 0.0
              cyr = sum("CYRILLIC" in unicodedata.name(c, "") for c in letters)
              return cyr / len(letters)

          SPECIAL = ("гъ", "гь", "къ", "оь", "уь")
          KUM_HINTS = (
              "булан", "учун", "герек", "дагъы", "къумукъ", "магъа", "сагъа",
              "мен", "сен", "олар", "биз", "гел", "бар", "бол", "эт", "тюгюл",
              "ёкъ", "яшав", "халкъ", "гюн", "гече", "ахшам", "нечик", "къайда",
              "бугюн", "тангала", "яхшы"
          )
          BAD_WEB = ("javascript", "cookie policy", "privacy policy", "lorem ipsum")

          def kumyk_evidence(s: str) -> float:
              t = norm(s).casefold()
              score = 0.0
              score += min(6.0, sum(t.count(x) for x in SPECIAL) * 0.50)
              score += min(
                  6.0,
                  sum(1 for x in KUM_HINTS if re.search(rf"(?<!\w){re.escape(x)}(?!\w)", t)) * 0.60
              )
              score -= sum(3.0 for x in BAD_WEB if x in t)
              return score

          def valid_ru_kum_pair(ru: str, kum: str) -> bool:
              ru, kum = norm(ru), norm(kum)
              if not ru or not kum:
                  return False
              if min(len(ru), len(kum)) < 2 or max(len(ru), len(kum)) > 3000:
                  return False
              if max(len(ru), len(kum)) / max(1, min(len(ru), len(kum))) > 7.0:
                  return False
              if cyr_ratio(ru) < 0.60 or cyr_ratio(kum) < 0.60:
                  return False
              if any(x in kum.casefold() for x in BAD_WEB):
                  return False
              return True

          def valid_en_kum_pair(en: str, kum: str) -> bool:
              en, kum = norm(en), norm(kum)
              if not en or not kum:
                  return False
              if min(len(en), len(kum)) < 3 or max(len(en), len(kum)) > 5000:
                  return False
              if max(len(en), len(kum)) / max(1, min(len(en), len(kum))) > 10:
                  return False
              return cyr_ratio(kum) >= 0.55

          def write_jsonl(path: Path, rows: Iterable[dict]):
              path.parent.mkdir(parents=True, exist_ok=True)
              n = 0
              with path.open("w", encoding="utf-8") as f:
                  for row in rows:
                      f.write(json.dumps(row, ensure_ascii=False) + "\n")
                      n += 1
              return n

          def iter_jsonl(path: Path):
              if not path.exists():
                  return
              with path.open(encoding="utf-8") as f:
                  for line in f:
                      if line.strip():
                          yield json.loads(line)

          def download(url: str, path: Path, allow_404=False):
              path.parent.mkdir(parents=True, exist_ok=True)
              log("GET", url)
              with requests.get(
                  url,
                  stream=True,
                  timeout=240,
                  headers={"User-Agent": "KumykAIResearch/2.0"},
                  allow_redirects=True,
              ) as r:
                  if allow_404 and r.status_code == 404:
                      return None
                  r.raise_for_status()
                  with path.open("wb") as f:
                      for chunk in r.iter_content(1024 * 1024):
                          if chunk:
                              f.write(chunk)
              return path

          def sha_key(*parts):
              return hashlib.sha256("\t".join(norm(str(x)).casefold() for x in parts).encode("utf-8")).hexdigest()

          # ---------------------------------------------------------------------
          # OPEN LEXICAL / MORPHOLOGICAL RESOURCES
          # ---------------------------------------------------------------------

          def collect_apertium():
              sid = "apertium_kum"
              try:
                  base = "https://raw.githubusercontent.com/apertium/apertium-kum/master/"
                  folder = RAW / sid
                  for name in ("apertium-kum.kum.lexc", "apertium-kum.kum.twol", "COPYING"):
                      download(base + name, folder / name)

                  lexc = (folder / "apertium-kum.kum.lexc").read_text(encoding="utf-8")
                  pos_sections = {
                      "Nouns": "noun", "Verbs": "verb", "Adjectives": "adjective",
                      "Adverbs": "adverb", "Pronouns": "pronoun", "Determiners": "determiner",
                      "Numerals": "numeral", "Postpositions": "postposition",
                      "Conjunctions": "conjunction", "Interjections": "interjection",
                  }

                  rows = []
                  seen = set()
                  for sec, pos in pos_sections.items():
                      start = lexc.find("LEXICON " + sec)
                      if start < 0:
                          continue
                      end = lexc.find("\nLEXICON ", start + 9)
                      block = lexc[start:end if end >= 0 else len(lexc)]
                      for raw in block.splitlines():
                          line = raw.strip()
                          if not line or line.startswith("!") or ":" not in line or ";" not in line:
                              continue
                          lemma = line.split(":", 1)[0].strip()
                          lemma = lemma.replace("% ", " ").replace("%-", "-").replace("%+", "")
                          if not lemma or lemma.startswith("%<") or lemma.startswith("#"):
                              continue
                          m = re.search(r'!\s*"([^"]*)"', line)
                          gloss = m.group(1).strip() if m else ""
                          key = (lemma, pos)
                          if key in seen:
                              continue
                          seen.add(key)
                          rows.append({
                              "kum": lemma,
                              "pos": pos,
                              "gloss_comment": gloss,
                              "source_id": sid,
                              "license": "GPL-family repository",
                          })

                  n = write_jsonl(PROC / "lexicon_apertium.jsonl", rows)
                  add_manifest(sid, "morphology_lexicon", "GPL-family repository", n)
              except Exception as e:
                  fail(sid, e)

          def collect_kaikki():
              sid = "kaikki_kum"
              try:
                  url = "https://kaikki.org/dictionary/Kumyk/kaikki.org-dictionary-Kumyk.jsonl"
                  path = download(url, RAW / sid / "kumyk.jsonl")
                  rows = []
                  with path.open(encoding="utf-8") as f:
                      for line in f:
                          if not line.strip():
                              continue
                          obj = json.loads(line)
                          senses = []
                          for s in obj.get("senses", []):
                              senses.append({
                                  "glosses": s.get("glosses", []),
                                  "tags": s.get("tags", []),
                                  "topics": s.get("topics", []),
                              })
                          forms = []
                          for x in obj.get("forms", []):
                              form = x.get("form")
                              if form and form not in forms:
                                  forms.append(form)
                          rows.append({
                              "kum": obj.get("word"),
                              "pos": obj.get("pos"),
                              "senses": senses,
                              "forms": forms,
                              "source_id": sid,
                              "license": "Wiktionary-derived",
                          })
                  n = write_jsonl(PROC / "lexicon_kaikki.jsonl", rows)
                  add_manifest(sid, "dictionary", "Wiktionary-derived CC BY-SA/GFDL context", n)
              except Exception as e:
                  fail(sid, e)

          def collect_panlex():
              sid = "panlex_meanings"
              try:
                  from datasets import load_dataset
                  kum = load_dataset("cointegrated/panlex-meanings", "kum", split="train").to_pandas()
                  rus = load_dataset("cointegrated/panlex-meanings", "rus", split="train").to_pandas()
                  kum = kum[["txt", "meaning", "langvar_uid"]].dropna().drop_duplicates()
                  rus = rus[["txt", "meaning", "langvar_uid"]].dropna().drop_duplicates()
                  merged = kum.merge(rus, on="meaning", suffixes=("_kum", "_ru"))
                  rows = []
                  for _, r in merged.iterrows():
                      ku, ru = norm(str(r["txt_kum"])), norm(str(r["txt_ru"]))
                      if not ku or not ru or ku.casefold() == ru.casefold():
                          continue
                      rows.append({
                          "kum": ku,
                          "ru": ru,
                          "meaning": int(r["meaning"]),
                          "kum_variant": r["langvar_uid_kum"],
                          "ru_variant": r["langvar_uid_ru"],
                          "source_id": sid,
                          "license": "CC0 1.0",
                      })
                  n = write_jsonl(PROC / "lexicon_panlex_ru_kum.jsonl", rows)
                  add_manifest(sid, "lexicon_parallel", "CC0 1.0", n)
              except Exception as e:
                  fail(sid, e)

          # ---------------------------------------------------------------------
          # TILIM PHRASEBOOK — HIGH-VALUE CONVERSATIONAL RU↔KUM
          # ---------------------------------------------------------------------

          def _section_blocks(h2):
              """Extract phrase-like blocks between one h2 and the next h2."""
              from bs4 import Tag, NavigableString

              blocks = []
              node = h2.next_sibling
              while node is not None:
                  if isinstance(node, Tag) and node.name == "h2":
                      break

                  if isinstance(node, NavigableString):
                      txt = norm(str(node))
                      if txt:
                          blocks.append(txt)
                  elif isinstance(node, Tag):
                      # Prefer paragraph/list blocks if present.
                      ps = node.find_all(["p", "li"], recursive=True)
                      if ps:
                          for p in ps:
                              txt = norm(p.get_text(" ", strip=True))
                              if txt:
                                  blocks.append(txt)
                      else:
                          leaf_divs = [
                              d for d in node.find_all("div", recursive=True)
                              if not d.find("div", recursive=False)
                          ]
                          if leaf_divs:
                              for d in leaf_divs:
                                  txt = norm(d.get_text(" ", strip=True))
                                  if txt:
                                      blocks.append(txt)
                          else:
                              txt = norm(node.get_text(" ", strip=True))
                              if txt:
                                  blocks.append(txt)
                  node = node.next_sibling

              # Remove consecutive duplicates introduced by nested containers.
              out = []
              for x in blocks:
                  if not out or x != out[-1]:
                      out.append(x)
              return out

          def collect_tilim_phrasebook():
              sid = "tilim_phrasebook"
              try:
                  from bs4 import BeautifulSoup

                  url = "https://til.im/ru/razgovornik"
                  r = requests.get(url, timeout=180, headers={"User-Agent": "KumykAIResearch/2.0"})
                  r.raise_for_status()
                  html = r.text
                  raw_path = RAW / sid / "razgovornik.html"
                  raw_path.parent.mkdir(parents=True, exist_ok=True)
                  raw_path.write_text(html, encoding="utf-8")

                  soup = BeautifulSoup(html, "html.parser")
                  for tag in soup(["script", "style", "noscript", "svg"]):
                      tag.decompose()

                  rows = []
                  sections = []
                  for h2 in soup.find_all("h2"):
                      topic = norm(h2.get_text(" ", strip=True))
                      if not topic or topic in {"Часто спрашивают"}:
                          continue
                      # Ignore non-phrasebook frontmatter headings if any.
                      if topic in {"О книге", "Примечания к электронному изданию", "Об авторах",
                                   "Некоторые особенности кумыкской графики и фонетики"}:
                          continue

                      blocks = _section_blocks(h2)
                      blocks = [
                          x for x in blocks
                          if x and not re.fullmatch(r"\d+", x)
                          and not x.startswith("Содержание")
                      ]
                      if len(blocks) < 2:
                          continue

                      # Most phrasebook sections are strict RU / KUM alternation.
                      section_rows = []
                      i = 0
                      while i + 1 < len(blocks):
                          ru, ku = blocks[i], blocks[i + 1]

                          # If an obvious duplicated heading/control line slipped in, advance one.
                          if ru == topic or ku == topic:
                              i += 1
                              continue

                          # HTML footnote fragments can occasionally create a one-token intrusion.
                          if len(ru) <= 2 and re.fullmatch(r"[\d*†‡]+", ru):
                              i += 1
                              continue

                          if valid_ru_kum_pair(ru, ku):
                              section_rows.append({
                                  "ru": ru,
                                  "kum": ku,
                                  "source_id": sid,
                                  "domain": "conversation",
                                  "topic": topic,
                                  "license": "CC BY-NC 3.0 Unported",
                                  "alignment": "Tilim HTML phrasebook order",
                              })
                              i += 2
                          else:
                              # Try shifting by one when the DOM inserted a stray block.
                              shifted = False
                              if i + 2 < len(blocks) and valid_ru_kum_pair(blocks[i], blocks[i + 2]):
                                  section_rows.append({
                                      "ru": blocks[i],
                                      "kum": blocks[i + 2],
                                      "source_id": sid,
                                      "domain": "conversation",
                                      "topic": topic,
                                      "license": "CC BY-NC 3.0 Unported",
                                      "alignment": "Tilim HTML phrasebook order; one-block shift",
                                  })
                                  i += 3
                                  shifted = True
                              if not shifted:
                                  i += 1

                      if section_rows:
                          rows.extend(section_rows)
                          sections.append({"topic": topic, "pairs": len(section_rows)})

                  # Exact dedup.
                  uniq = {}
                  for x in rows:
                      uniq[(x["ru"].casefold(), x["kum"].casefold())] = x
                  rows = list(uniq.values())

                  # Safety: a DOM change should not silently create a tiny/garbled "success".
                  if len(rows) < 1000:
                      raise RuntimeError(
                          f"Tilim parser produced only {len(rows)} pairs; expected >1000. "
                          "HTML structure may have changed."
                      )

                  n = write_jsonl(PROC / "parallel_tilim_phrasebook.jsonl", rows)
                  (REPORTS / "tilim_phrasebook_sections.json").write_text(
                      json.dumps(sections, ensure_ascii=False, indent=2), encoding="utf-8"
                  )
                  add_manifest(
                      sid,
                      "parallel_conversation",
                      "CC BY-NC 3.0 Unported",
                      n,
                      "Electronic edition by Tilim; attribution/non-commercial terms retained.",
                      {"topics_parsed": len(sections)},
                  )
              except Exception as e:
                  fail(sid, e)

          # ---------------------------------------------------------------------
          # TATOEBA — WEEKLY EXPORTS, NO FRAGILE API QUERY
          # ---------------------------------------------------------------------

          def _read_tatoeba_sentences(path: Path):
              out = {}
              with bz2.open(path, "rt", encoding="utf-8", errors="replace") as f:
                  for line in f:
                      parts = line.rstrip("\n").split("\t")
                      if len(parts) < 3:
                          continue
                      try:
                          sid = int(parts[0])
                      except Exception:
                          continue
                      out[sid] = norm(parts[2])
              return out

          def collect_tatoeba_exports():
              sid = "tatoeba"
              try:
                  folder = RAW / sid
                  folder.mkdir(parents=True, exist_ok=True)
                  base = "https://downloads.tatoeba.org/exports/per_language"

                  ku_path = download(
                      f"{base}/kum/kum_sentences.tsv.bz2",
                      folder / "kum_sentences.tsv.bz2",
                  )
                  ru_path = download(
                      f"{base}/rus/rus_sentences.tsv.bz2",
                      folder / "rus_sentences.tsv.bz2",
                  )

                  link_path = None
                  link_candidates = [
                      f"{base}/kum/kum-rus_links.tsv.bz2",
                      f"{base}/kum/rus-kum_links.tsv.bz2",
                      f"{base}/rus/kum-rus_links.tsv.bz2",
                      f"{base}/rus/rus-kum_links.tsv.bz2",
                  ]
                  for u in link_candidates:
                      try:
                          p = download(u, folder / "links.tsv.bz2", allow_404=True)
                          if p is not None:
                              link_path = p
                              break
                      except requests.HTTPError as e:
                          if getattr(e.response, "status_code", None) == 404:
                              continue
                          raise

                  if link_path is None:
                      raise RuntimeError("Could not locate Kumyk↔Russian Tatoeba link export.")

                  kum = _read_tatoeba_sentences(ku_path)
                  rus = _read_tatoeba_sentences(ru_path)

                  rows = []
                  with bz2.open(link_path, "rt", encoding="utf-8", errors="replace") as f:
                      for line in f:
                          p = line.strip().split("\t")
                          if len(p) < 2:
                              continue
                          try:
                              a, b = int(p[0]), int(p[1])
                          except Exception:
                              continue

                          if a in kum and b in rus:
                              ku, ru = kum[a], rus[b]
                              ku_id, ru_id = a, b
                          elif b in kum and a in rus:
                              ku, ru = kum[b], rus[a]
                              ku_id, ru_id = b, a
                          else:
                              continue

                          if valid_ru_kum_pair(ru, ku):
                              rows.append({
                                  "ru": ru, "kum": ku,
                                  "ru_id": ru_id, "kum_id": ku_id,
                                  "source_id": sid,
                                  "domain": "conversation",
                                  "license": "CC BY 2.0 FR",
                              })

                  uniq = {}
                  for x in rows:
                      uniq[(x["ru"].casefold(), x["kum"].casefold())] = x
                  rows = list(uniq.values())
                  n = write_jsonl(PROC / "parallel_tatoeba.jsonl", rows)
                  add_manifest(sid, "parallel", "CC BY 2.0 FR", n, "Weekly per-language exports")
              except Exception as e:
                  fail(sid, e)

          # ---------------------------------------------------------------------
          # TIL — RECOVER THE 2021 PUBLIC SNAPSHOT FROM GOOGLE DRIVE
          # ---------------------------------------------------------------------

          TIL_DRIVE = "https://drive.google.com/drive/folders/1sbkwGuKVSxWCVbMOQhOiizdlJSumahRD"

          def _unpack_if_archive(path: Path, dest: Path):
              dest.mkdir(parents=True, exist_ok=True)
              low = path.name.lower()
              try:
                  if zipfile.is_zipfile(path):
                      with zipfile.ZipFile(path) as z:
                          z.extractall(dest)
                      return True
                  if tarfile.is_tarfile(path):
                      with tarfile.open(path) as t:
                          t.extractall(dest)
                      return True
                  if low.endswith(".gz") and not low.endswith((".tar.gz", ".tgz")):
                      out = dest / path.name[:-3]
                      with gzip.open(path, "rb") as src, out.open("wb") as dst:
                          shutil.copyfileobj(src, dst)
                      return True
                  if low.endswith(".bz2"):
                      out = dest / path.name[:-4]
                      with bz2.open(path, "rb") as src, out.open("wb") as dst:
                          shutil.copyfileobj(src, dst)
                      return True
              except Exception as e:
                  log("Archive unpack warning", path, e)
              return False

          def _lang_file_key(path: Path, root: Path):
              rel = str(path.relative_to(root)).replace("\\", "/")
              low = rel.lower()

              patterns = [
                  (r"(?P<base>.*)\.(?P<lang>ru|kum)$", None),
                  (r"(?P<base>.*)[._-](?P<lang>ru|kum)\.txt$", None),
              ]
              for pat, _ in patterns:
                  m = re.fullmatch(pat, low)
                  if m:
                      return m.group("base"), m.group("lang")
              return None, None

          def collect_til_drive_snapshot():
              sid = "til_ru_kum_drive_snapshot"
              try:
                  folder = RAW / sid
                  folder.mkdir(parents=True, exist_ok=True)

                  cmd = ["gdown", TIL_DRIVE, "--folder", "--json", "--quiet"]
                  log("TIL Drive listing:", " ".join(cmd))
                  p = subprocess.run(cmd, capture_output=True, text=True, check=True, timeout=900)
                  listing = json.loads(p.stdout)
                  (REPORTS / "til_drive_listing.json").write_text(
                      json.dumps(listing, ensure_ascii=False, indent=2), encoding="utf-8"
                  )

                  def relevant(path):
                      low = path.lower().replace("\\", "/")
                      if "ru-kum" in low or "kum-ru" in low:
                          return True
                      tokens = re.split(r"[/_.-]+", low)
                      return "kum" in tokens and ("ru" in tokens or "rus" in tokens)

                  candidates = [x for x in listing if relevant(str(x.get("path", "")))]
                  (REPORTS / "til_drive_candidates.json").write_text(
                      json.dumps(candidates, ensure_ascii=False, indent=2), encoding="utf-8"
                  )
                  log("TIL Drive relevant entries", len(candidates))

                  if not candidates:
                      raise RuntimeError(
                          f"Google Drive snapshot listed {len(listing)} entries but none matched RU↔KUM."
                      )

                  downloaded = []
                  for i, item in enumerate(candidates):
                      url = item.get("url")
                      original = Path(str(item.get("path") or f"file_{i}")).name
                      if not url:
                          continue
                      dest = folder / f"{i:03d}_{original}"
                      log("TIL download", item.get("path"))
                      subprocess.run(
                          ["gdown", url, "-O", str(dest), "--quiet", "--continue"],
                          check=True, timeout=900
                      )
                      downloaded.append(dest)

                  unpack = folder / "_unpacked"
                  unpack.mkdir(exist_ok=True)
                  for pth in downloaded:
                      if not _unpack_if_archive(pth, unpack):
                          # Keep non-archives inside unpack tree for unified parsing.
                          target = unpack / pth.name
                          if not target.exists():
                              shutil.copy2(pth, target)

                  all_files = [p for p in unpack.rglob("*") if p.is_file()]
                  indexed = collections.defaultdict(dict)
                  for pth in all_files:
                      key, lang = _lang_file_key(pth, unpack)
                      if key and lang:
                          indexed[key][lang] = pth

                  rows = []
                  for key, langs in indexed.items():
                      if "ru" not in langs or "kum" not in langs:
                          continue
                      rp, kp = langs["ru"], langs["kum"]
                      ru_lines = rp.read_text(encoding="utf-8", errors="replace").splitlines()
                      ku_lines = kp.read_text(encoding="utf-8", errors="replace").splitlines()
                      lowkey = key.lower()
                      split = "train"
                      if "/dev" in "/" + lowkey or "dev/" in lowkey:
                          split = "dev"
                      elif "/test" in "/" + lowkey or "test/" in lowkey:
                          split = "test"

                      for i, (ru, ku) in enumerate(zip(ru_lines, ku_lines)):
                          ru, ku = norm(ru), norm(ku)
                          if valid_ru_kum_pair(ru, ku):
                              rows.append({
                                  "ru": ru, "kum": ku,
                                  "source_id": sid,
                                  "source_split": split,
                                  "source_file_key": key,
                                  "source_line": i + 1,
                                  "domain": "mixed",
                                  "license": "CC BY-NC-SA 4.0",
                              })

                  # Fallback for explicit TSV/CSV with ru/kum headers.
                  if not rows:
                      for pth in all_files:
                          if pth.suffix.lower() not in (".tsv", ".csv"):
                              continue
                          delim = "\t" if pth.suffix.lower() == ".tsv" else ","
                          try:
                              with pth.open(encoding="utf-8", errors="replace", newline="") as f:
                                  reader = csv.DictReader(f, delimiter=delim)
                                  fields = {x.lower(): x for x in (reader.fieldnames or [])}
                                  ruk = fields.get("ru") or fields.get("rus") or fields.get("russian")
                                  kuk = fields.get("kum") or fields.get("kumyk")
                                  if not ruk or not kuk:
                                      continue
                                  for i, rec in enumerate(reader):
                                      ru, ku = norm(rec.get(ruk, "")), norm(rec.get(kuk, ""))
                                      if valid_ru_kum_pair(ru, ku):
                                          rows.append({
                                              "ru": ru, "kum": ku,
                                              "source_id": sid,
                                              "source_split": "train",
                                              "source_file_key": str(pth.relative_to(unpack)),
                                              "source_line": i + 2,
                                              "domain": "mixed",
                                              "license": "CC BY-NC-SA 4.0",
                                          })
                          except Exception:
                              continue

                  uniq = {}
                  for x in rows:
                      uniq[(x["ru"].casefold(), x["kum"].casefold())] = x
                  rows = list(uniq.values())

                  if not rows:
                      raise RuntimeError(
                          "Downloaded matching TIL snapshot files, but no RU/KUM parallel text could be parsed."
                      )

                  n = write_jsonl(PROC / "parallel_til.jsonl", rows)
                  add_manifest(
                      sid, "parallel", "CC BY-NC-SA 4.0", n,
                      "Recovered from the public EMNLP-2021 Google Drive snapshot.",
                      {"drive_candidates": len(candidates)}
                  )
              except Exception as e:
                  fail(sid, e)

          # ---------------------------------------------------------------------
          # MONOLINGUAL KUMYK
          # ---------------------------------------------------------------------

          MADLAD_KUM_CLEAN = (
              "https://huggingface.co/datasets/allenai/MADLAD-400/resolve/"
              "ecd71297d60c1eb996cd3d7c44c60ad5b55adfc6/data/kum/kum_clean_0000.jsonl.gz"
          )

          def collect_madlad_direct():
              sid = "madlad400_kum_clean"
              try:
                  path = download(MADLAD_KUM_CLEAN, RAW / sid / "kum_clean_0000.jsonl.gz")
                  rows = []
                  with gzip.open(path, "rt", encoding="utf-8", errors="replace") as f:
                      for i, line in enumerate(f):
                          if not line.strip():
                              continue
                          obj = json.loads(line)
                          text = norm(str(obj.get("text", "")))
                          if len(text) < 20 or cyr_ratio(text) < 0.60:
                              continue
                          rows.append({
                              "id": i,
                              "text": text,
                              "source_id": sid,
                              "license": "ODC-BY",
                              "kumyk_evidence": round(kumyk_evidence(text), 2),
                          })
                  n = write_jsonl(PROC / "mono_madlad400_clean.jsonl", rows)
                  add_manifest(sid, "monolingual", "ODC-BY", n, "Stable explicit Kumyk clean shard URL")
              except Exception as e:
                  fail(sid, e)

          def _stream_hf_text_dataset(repo, config, sid, out_name, max_docs=10000, max_chars=MONO_CHAR_CAP_PER_WEB_SOURCE):
              from datasets import load_dataset

              ds = load_dataset(repo, config, split="train", streaming=True)
              out = PROC / out_name
              out.parent.mkdir(parents=True, exist_ok=True)
              n = 0
              chars = 0
              with out.open("w", encoding="utf-8") as f:
                  for row in ds:
                      text = norm(str(
                          row.get("text")
                          or row.get("content")
                          or row.get("document")
                          or ""
                      ))
                      if len(text) < 100 or cyr_ratio(text) < 0.62:
                          continue
                      if any(x in text.casefold() for x in BAD_WEB):
                          continue

                      rec = {
                          "text": text,
                          "source_id": sid,
                          "kumyk_evidence": round(kumyk_evidence(text), 2),
                      }
                      for k in ("language_score", "language_probability", "ocr_score", "edu_score", "url"):
                          if k in row:
                              v = row.get(k)
                              try:
                                  json.dumps(v)
                                  rec[k] = v
                              except Exception:
                                  rec[k] = str(v)

                      f.write(json.dumps(rec, ensure_ascii=False) + "\n")
                      n += 1
                      chars += len(text)
                      if n >= max_docs or chars >= max_chars:
                          break
              return n, chars

          def collect_finepdfs():
              sid = "finepdfs_kum"
              try:
                  n, chars = _stream_hf_text_dataset(
                      "HuggingFaceFW/FinePDFs", "kum_Cyrl", sid,
                      "mono_finepdfs_kum.jsonl", max_docs=5000, max_chars=15_000_000
                  )
                  add_manifest(sid, "monolingual_pdf", "ODC-BY", n, extra={"characters": chars})
              except Exception as e:
                  fail(sid, e)

          def collect_fineweb2_sample():
              sid = "fineweb2_kum_sample"
              try:
                  n, chars = _stream_hf_text_dataset(
                      "HuggingFaceFW/fineweb-2", "kum_Cyrl", sid,
                      "mono_fineweb2_kum_sample.jsonl", max_docs=10000, max_chars=20_000_000
                  )
                  add_manifest(sid, "monolingual_web_sample", "ODC-BY", n, extra={"characters": chars})
              except Exception as e:
                  fail(sid, e)

          # ---------------------------------------------------------------------
          # FINETRANSLATIONS — KUMYK ORIGINAL + SYNTHETIC ENGLISH AUXILIARY
          # ---------------------------------------------------------------------

          def _chunk_text(x):
              if isinstance(x, str):
                  return norm(x)
              if isinstance(x, dict):
                  for k in ("text", "translation", "translated_text", "content"):
                      if x.get(k):
                          return norm(str(x[k]))
              return norm(str(x)) if x is not None else ""

          def collect_finetranslations():
              sid = "finetranslations_kum_en_synthetic"
              try:
                  from datasets import load_dataset
                  ds = load_dataset(
                      "HuggingFaceFW/FineTranslations",
                      "kum_Cyrl",
                      split="train",
                      streaming=True,
                  )

                  mono_path = PROC / "mono_finetranslations_original_kum.jsonl"
                  aux_path = PROC / "aux_en_kum_synthetic.jsonl"
                  mono_path.parent.mkdir(parents=True, exist_ok=True)
                  docs = 0
                  pairs = 0

                  with mono_path.open("w", encoding="utf-8") as fm, aux_path.open("w", encoding="utf-8") as fp:
                      for row in ds:
                          og_chunks = row.get("og_chunks") or []
                          tr_chunks = row.get("translated_chunks") or []

                          full = norm(str(row.get("og_full_text") or ""))
                          if not full and og_chunks:
                              full = norm(" ".join(_chunk_text(x) for x in og_chunks))
                          if full and cyr_ratio(full) >= 0.55:
                              fm.write(json.dumps({
                                  "text": full,
                                  "source_id": sid,
                                  "url": row.get("url"),
                                  "og_language_score": row.get("og_language_score"),
                                  "og_quality_score": row.get("og_quality_score"),
                                  "edu_score": row.get("edu_score"),
                                  "license": "ODC-BY",
                              }, ensure_ascii=False) + "\n")
                              docs += 1

                          if isinstance(og_chunks, list) and isinstance(tr_chunks, list):
                              for ku_raw, en_raw in zip(og_chunks, tr_chunks):
                                  ku = _chunk_text(ku_raw)
                                  en = _chunk_text(en_raw)
                                  if valid_en_kum_pair(en, ku):
                                      fp.write(json.dumps({
                                          "en": en,
                                          "kum": ku,
                                          "source_id": sid,
                                          "domain": "web",
                                          "translation_type": "synthetic_english_from_kumyk",
                                          "license": "ODC-BY",
                                          "url": row.get("url"),
                                      }, ensure_ascii=False) + "\n")
                                      pairs += 1

                  add_manifest(
                      sid,
                      "aux_parallel_en_kum_synthetic",
                      "ODC-BY",
                      pairs,
                      "English side is machine-generated; use below human RU↔KUM data.",
                      {"kumyk_documents": docs},
                  )
              except Exception as e:
                  fail(sid, e)

          # ---------------------------------------------------------------------
          # BIBLE / CONSTITUTION — DOMAIN-SPECIFIC RU↔KUM
          # ---------------------------------------------------------------------

          def collect_bible():
              sid = "bible_caucasus"
              try:
                  from datasets import load_dataset
                  kum = load_dataset("AlidarAsvarov/bible-caucasus", "kumyk", split="train").to_pandas()
                  rus = load_dataset("AlidarAsvarov/bible-caucasus", "russian", split="train").to_pandas()
                  key = ["osis_id", "chapter", "start_verse"]
                  merged = kum.merge(rus, on=key, suffixes=("_kum", "_ru"))
                  rows = []
                  for _, r in merged.iterrows():
                      ru, ku = norm(str(r["text_ru"])), norm(str(r["text_kum"]))
                      if valid_ru_kum_pair(ru, ku):
                          rows.append({
                              "ru": ru,
                              "kum": ku,
                              "osis_id": r["osis_id"],
                              "chapter": int(r["chapter"]),
                              "verse": int(r["start_verse"]),
                              "source_id": sid,
                              "domain": "religious",
                              "license": "IBT copyright / non-commercial research redistribution",
                          })
                  n = write_jsonl(PROC / "parallel_bible_full.jsonl", rows)
                  add_manifest(
                      sid,
                      "parallel_religious",
                      "IBT copyright / non-commercial research",
                      n,
                      f"Kept as a separate religious corpus; only capped at {BIBLE_GENERAL_CAP} in general train."
                  )
              except Exception as e:
                  fail(sid, e)

          def collect_constitution_optional():
              sid = "dagestan_constitution"
              token = os.environ.get("HF_TOKEN", "").strip()
              if not token:
                  add_manifest(
                      sid, "parallel_optional", "CC0 1.0", 0,
                      "Skipped: gated dataset requires accepted access + HF_TOKEN."
                  )
                  return
              try:
                  from datasets import load_dataset
                  ds = None
                  last = None
                  for config in ("dag_constitution", None):
                      try:
                          if config:
                              ds = load_dataset(
                                  "AlidarAsvarov/dagestan-constitution",
                                  config, split="train", token=token
                              )
                          else:
                              ds = load_dataset(
                                  "AlidarAsvarov/dagestan-constitution",
                                  split="train", token=token
                              )
                          break
                      except Exception as e:
                          last = e
                  if ds is None:
                      raise last or RuntimeError("Could not load Constitution dataset.")

                  rows = []
                  for i, r in enumerate(ds):
                      ru = norm(str(r.get("rus") or r.get("ru") or ""))
                      ku = norm(str(r.get("kum") or ""))
                      if valid_ru_kum_pair(ru, ku):
                          rows.append({
                              "ru": ru, "kum": ku,
                              "source_id": sid,
                              "domain": "legal",
                              "source_row": i,
                              "license": "CC0 1.0",
                          })
                  n = write_jsonl(PROC / "parallel_constitution.jsonl", rows)
                  add_manifest(sid, "parallel_legal", "CC0 1.0", n)
              except Exception as e:
                  fail(sid, e)

          # ---------------------------------------------------------------------
          # GOLD / FINAL DATASET ASSEMBLY
          # ---------------------------------------------------------------------

          HUMAN_GOLD = [
              {
                  "ru": "Я пошёл играть во двор с друзьями.",
                  "kum": "Мен къурдашларым булан абзаргъа ойнамагъа бардым.",
                  "domain": "conversation",
                  "source_id": "human_gold",
                  "status": "user-approved",
              },
              {
                  "ru": "Убери свою постель.",
                  "kum": "Оьзюнгню тёшегингни тайдыр.",
                  "domain": "conversation",
                  "source_id": "human_gold",
                  "status": "user-corrected-approved",
              },
              {
                  "ru": "Закрой, пожалуйста, дверь и иди ко мне.",
                  "kum": "Эшикни яп, ярай буса, магъа гел.",
                  "domain": "conversation",
                  "source_id": "human_gold",
                  "status": "user-approved",
              },
              {
                  "ru": "Я приеду в Махачкалу и мы пойдём с вами вместе гулять. Вы согласны, друзья? Только гулять пойдём позже вечером.",
                  "kum": "Мен Магьачкъалагъа гележекмен, биз сизин булан бирге къыдырмагъа баражакъбыз. Къурдашлар, разисизми? Тек къыдырмагъа ахшам гечирек баражакъбыз.",
                  "domain": "conversation",
                  "source_id": "human_gold",
                  "status": "user-approved",
              },
              {
                  "ru": "Я вчера приехал в Махачкалу, остался на ночь, теперь поехал в Коркмаскалу, тоже остался на ночь и думаю, теперь ехать мне в Махачкалу обратно или нет. Друзья собираются пойти гулять, а я ещё думаю: поехать мне ночью или завтра утром, потому что мне ещё нужно на работу.",
                  "kum": "Тюнегюн Магьачкъалагъа гелдим, гече къалдым. Сонг Къоркъмаскъалагъа бардым, анда да гече къалдым. Энди ойлашаман: Магьачкъалагъа гери барайыммы, бармайыммы? Къурдашларым къыдырмагъа айлана, мен буса дагъы ойлашаман: гече барайыммы яда тангала эртен барайыммы, неге тюгюл магъа дагъы ишге бармагъа герек.",
                  "domain": "conversation",
                  "source_id": "human_gold",
                  "status": "user-approved",
              },
          ]

          SOURCE_WEIGHTS = {
              "tilim_phrasebook": 5.0,
              "tatoeba": 5.0,
              "til_ru_kum_drive_snapshot": 3.0,
              "dagestan_constitution": 1.5,
              "bible_caucasus": 0.20,
          }

          def deterministic_split(x):
              # Honor official TIL split when recovered.
              src_split = x.get("source_split")
              if src_split in ("train", "dev", "test"):
                  return src_split

              h = int(sha_key(x["ru"], x["kum"])[:8], 16) % 100
              return "test" if h < 5 else ("dev" if h < 10 else "train")

          def build_unified_lexicon():
              rows = []
              seen = set()

              # PanLex: direct RU↔KUM meaning links.
              for x in iter_jsonl(PROC / "lexicon_panlex_ru_kum.jsonl") or []:
                  ru, ku = norm(x.get("ru", "")), norm(x.get("kum", ""))
                  if not ru or not ku:
                      continue
                  key = (ru.casefold(), ku.casefold(), "panlex")
                  if key in seen:
                      continue
                  seen.add(key)
                  rows.append({
                      "ru": ru, "kum": ku,
                      "source_id": x["source_id"],
                      "evidence": "PanLex shared meaning id",
                      "confidence": "medium",
                      "license": x.get("license"),
                  })

              # Apertium Russian comments: only keep clearly Cyrillic glosses.
              for x in iter_jsonl(PROC / "lexicon_apertium.jsonl") or []:
                  ku = norm(x.get("kum", ""))
                  gloss = norm(x.get("gloss_comment", ""))
                  if not ku or not gloss or cyr_ratio(gloss) < 0.55:
                      continue
                  # Preserve raw multi-sense gloss instead of pretending comma items are independent meanings.
                  key = (gloss.casefold(), ku.casefold(), "apertium")
                  if key in seen:
                      continue
                  seen.add(key)
                  rows.append({
                      "ru": gloss, "kum": ku,
                      "pos": x.get("pos"),
                      "source_id": "apertium_kum",
                      "evidence": "Apertium lexicon comment",
                      "confidence": "medium",
                      "license": "GPL-family repository",
                  })

              n = write_jsonl(FINAL / "lexicon" / "ru_kum_lexicon.jsonl", rows)
              return n

          def build_final():
              source_files = {
                  "tilim_phrasebook": PROC / "parallel_tilim_phrasebook.jsonl",
                  "tatoeba": PROC / "parallel_tatoeba.jsonl",
                  "til_ru_kum_drive_snapshot": PROC / "parallel_til.jsonl",
                  "dagestan_constitution": PROC / "parallel_constitution.jsonl",
              }

              gold_ru = {norm(x["ru"]).casefold() for x in HUMAN_GOLD}
              gold_pair = {
                  (norm(x["ru"]).casefold(), norm(x["kum"]).casefold())
                  for x in HUMAN_GOLD
              }

              general = []
              for sid, path in source_files.items():
                  if not path.exists():
                      continue
                  for x in iter_jsonl(path):
                      ru, ku = norm(x.get("ru", "")), norm(x.get("kum", ""))
                      if not valid_ru_kum_pair(ru, ku):
                          continue
                      if ru.casefold() in gold_ru or (ru.casefold(), ku.casefold()) in gold_pair:
                          continue
                      x["ru"], x["kum"] = ru, ku
                      x["sample_weight"] = SOURCE_WEIGHTS[sid]
                      x["kumyk_evidence"] = round(kumyk_evidence(ku), 2)
                      general.append(x)

              # Exact pair dedup: keep highest-weight evidence.
              dedup = {}
              for x in general:
                  k = (x["ru"].casefold(), x["kum"].casefold())
                  if k not in dedup or x["sample_weight"] > dedup[k]["sample_weight"]:
                      dedup[k] = x
              general = list(dedup.values())

              # Add only a small deterministic Bible subset to general TRAIN, never general dev/test.
              bible_full = list(iter_jsonl(PROC / "parallel_bible_full.jsonl") or [])
              bible_sorted = sorted(bible_full, key=lambda x: sha_key(x.get("ru", ""), x.get("kum", "")))
              bible_general = []
              for x in bible_sorted:
                  if len(bible_general) >= BIBLE_GENERAL_CAP:
                      break
                  ru, ku = norm(x.get("ru", "")), norm(x.get("kum", ""))
                  if not valid_ru_kum_pair(ru, ku):
                      continue
                  if ru.casefold() in gold_ru:
                      continue
                  y = dict(x)
                  y["ru"], y["kum"] = ru, ku
                  y["sample_weight"] = SOURCE_WEIGHTS["bible_caucasus"]
                  y["general_split_override"] = "train"
                  y["kumyk_evidence"] = round(kumyk_evidence(ku), 2)
                  bible_general.append(y)

              buckets = {"train": [], "dev": [], "test": []}
              for x in general:
                  buckets[deterministic_split(x)].append(x)
              buckets["train"].extend(bible_general)

              # Count ambiguous source sentences after dedup.
              ru_to_kum = collections.defaultdict(set)
              for x in general:
                  ru_to_kum[x["ru"].casefold()].add(x["kum"].casefold())
              for bucket in buckets.values():
                  for x in bucket:
                      x["translation_conflict_count"] = len(ru_to_kum.get(x["ru"].casefold(), {x["kum"].casefold()}))

              for split, rows in buckets.items():
                  write_jsonl(FINAL / "ru_kum_general" / f"{split}.jsonl", rows)

              # Dedicated domain files.
              write_jsonl(FINAL / "ru_kum_religious" / "bible_full.jsonl", bible_full)

              conversation_test = [
                  x for x in buckets["test"]
                  if x.get("domain") == "conversation"
              ]
              write_jsonl(FINAL / "benchmarks" / "test_conversation.jsonl", conversation_test)

              legal_test = [
                  x for x in buckets["test"]
                  if x.get("domain") == "legal"
              ]
              write_jsonl(FINAL / "benchmarks" / "test_legal.jsonl", legal_test)

              religious_test = bible_sorted[:500]
              write_jsonl(FINAL / "benchmarks" / "test_religious.jsonl", religious_test)

              write_jsonl(FINAL / "benchmarks" / "human_gold.jsonl", HUMAN_GOLD)

              lexicon_n = build_unified_lexicon()

              by_source = collections.Counter(
                  x.get("source_id", "unknown")
                  for split in buckets.values()
                  for x in split
              )

              mono_stats = {}
              for p in sorted(PROC.glob("mono_*.jsonl")):
                  count = sum(1 for _ in p.open(encoding="utf-8"))
                  mono_stats[p.name] = count

              aux_stats = {}
              for p in sorted(PROC.glob("aux_*.jsonl")):
                  count = sum(1 for _ in p.open(encoding="utf-8"))
                  aux_stats[p.name] = count

              stats = {
                  "general_parallel_total": sum(len(v) for v in buckets.values()),
                  "general_train": len(buckets["train"]),
                  "general_dev": len(buckets["dev"]),
                  "general_test": len(buckets["test"]),
                  "general_by_source": dict(by_source),
                  "bible_full_rows": len(bible_full),
                  "bible_rows_admitted_to_general_train": len(bible_general),
                  "same_russian_multiple_kumyk": sum(1 for v in ru_to_kum.values() if len(v) > 1),
                  "human_gold_held_out": len(HUMAN_GOLD),
                  "unified_ru_kum_lexicon": lexicon_n,
                  "monolingual_files": mono_stats,
                  "auxiliary_files": aux_stats,
              }
              (REPORTS / "dataset_stats.json").write_text(
                  json.dumps(stats, ensure_ascii=False, indent=2), encoding="utf-8"
              )
              return stats

          def main():
              log("=== Kumyk AI Dataset v2 build ===")

              # Core linguistic/lexical layers.
              collect_apertium()
              collect_kaikki()
              collect_panlex()

              # Highest-value RU↔KUM general/conversational layers first.
              collect_tilim_phrasebook()
              collect_tatoeba_exports()
              collect_til_drive_snapshot()
              collect_constitution_optional()

              # Monolingual + auxiliary multilingual layers.
              collect_madlad_direct()
              collect_finetranslations()
              collect_finepdfs()
              collect_fineweb2_sample()

              # Domain-specific RU↔KUM, kept mostly separate.
              collect_bible()

              stats = build_final()

              (REPORTS / "manifest.json").write_text(
                  json.dumps(MANIFEST, ensure_ascii=False, indent=2), encoding="utf-8"
              )
              (REPORTS / "errors.json").write_text(
                  json.dumps(ERRORS, ensure_ascii=False, indent=2), encoding="utf-8"
              )
              summary = {
                  "stats": stats,
                  "sources": MANIFEST,
                  "errors": ERRORS,
                  "design": {
                      "bible_policy": f"full separate corpus; only {BIBLE_GENERAL_CAP} deterministic rows admitted to general train",
                      "human_gold_policy": "never train",
                      "synthetic_english_policy": "separate auxiliary EN↔KUM file; never treated as human gold",
                      "tilim_policy": "CC BY-NC 3.0, appropriate for this private non-commercial project with attribution",
                  },
              }
              (REPORTS / "SUMMARY.json").write_text(
                  json.dumps(summary, ensure_ascii=False, indent=2), encoding="utf-8"
              )

              text = [
                  "Kumyk AI Dataset v2",
                  f"General RU↔KUM total: {stats['general_parallel_total']}",
                  f"Train/dev/test: {stats['general_train']}/{stats['general_dev']}/{stats['general_test']}",
                  f"By source: {stats['general_by_source']}",
                  f"Bible full/separate: {stats['bible_full_rows']}",
                  f"Bible admitted to general train: {stats['bible_rows_admitted_to_general_train']}",
                  f"Unified lexicon: {stats['unified_ru_kum_lexicon']}",
                  f"Human gold held out: {stats['human_gold_held_out']}",
                  f"Errors: {len(ERRORS)}",
                  "",
                  "See reports/SUMMARY.json and reports/errors.json.",
              ]
              (ROOT / "README.txt").write_text("\n".join(text), encoding="utf-8")
              log(json.dumps(summary, ensure_ascii=False, indent=2))

          if __name__ == "__main__":
              main()
          PY

      - name: Collect and build v2 dataset
        run: python collect_kumyk_dataset_v2.py

      - name: Pack artifact
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          root = Path("kumyk_dataset_v2")
          out = Path("Kumyk-AI-Dataset-v2.zip")
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED, allowZip64=True) as z:
              for p in root.rglob("*"):
                  if p.is_file():
                      z.write(p, p.relative_to(root.parent))
          print(out, out.stat().st_size)
          PY

      - name: Upload v2 dataset artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kumyk-AI-Dataset-v2
          path: Kumyk-AI-Dataset-v2.zip
          retention-days: 90
